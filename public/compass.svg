<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Background disk for contrast on both dark and light browser tab bars -->
  <circle cx="16" cy="16" r="15" fill="#090d16" />
  
  <!-- Outer glowing ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#ringGrad)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Cardinal ticks -->
  <line x1="16" y1="4.5" x2="16" y2="7.5" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16" y1="24.5" x2="16" y2="27.5" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="4.5" y1="16" x2="7.5" y2="16" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="24.5" y1="16" x2="27.5" y2="16" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />

  <!-- Needle Group pointing North-East (45 deg) -->
  <g transform="translate(16,16) rotate(45)">
    <!-- North Needle (Blue/Cyan) -->
    <polygon points="0,0 -3.2,-4 0,-11.5" fill="#60a5fa" />
    <polygon points="0,0 3.2,-4 0,-11.5" fill="url(#needleNorth)" />

    <!-- South Needle (Silver/White) -->
    <polygon points="0,0 -3.2,4 0,11.5" fill="#ffffff" />
    <polygon points="0,0 3.2,4 0,11.5" fill="url(#needleSouth)" />

    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="2.2" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  </g>
</svg>
